const app=document.getElementById('app');let step=-1,answers=[],previous=null,selected=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){app.className='stage';if(step===-1){app.innerHTML=`<p class="eyebrow">THE GHOST LIBRARIAN</p><h1 class="heading">유령 사서의<br>잔혹한 도서 운세</h1><p class="sub">도서관에 잠든 50권의 비밀.<br>세 번의 선택 끝에 당신의 운명이 깨어납니다.</p><div class="orb-wrap" aria-hidden="true"><div class="orb"><span>✦</span></div></div><div class="ornament">✧ · ☾ · ✧</div><button class="btn" id="start">운명의 문 열기 &nbsp; →</button><p class="tiny">약 1분 소요 · 정답은 없습니다</p>`;document.getElementById('start').onclick=()=>{step=0;render()};return}if(step<3){let q=QUESTIONS[step];app.innerHTML=`<div class="progress">${[0,1,2].map(i=>`<div class="${i<=step?'on':''}"></div>`).join('')}</div><div class="qnum">CHAPTER 0${step+1} / 03</div><h1 class="question">${esc(q.heading)}</h1><p class="qhint">${esc(q.hint)}</p><div class="choices">${q.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><span class="symbol">${c[0]}</span><span>${esc(c[1])}</span></button>`).join('')}</div><button class="back" id="back">← 이전으로</button>`;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[step]=+b.dataset.choice;step++;if(step===3){showLoading()}else render()});document.getElementById('back').onclick=()=>{step--;render()};return}showResult()}
function getScore(b){return (b.genre_tag===QUESTIONS[0].choices[answers[0]][2]?50:0)+(b.experience_tag===QUESTIONS[1].choices[answers[1]][2]?35:0)+(b.fate_tag===QUESTIONS[2].choices[answers[2]][2]?15:0)}
function pick(){let scores=BOOKS.map(b=>({b,score:getScore(b)}));let best=Math.max(...scores.map(x=>x.score));let pool=scores.filter(x=>x.score>=best-35&&x.score>=35&&x.b.id!==previous);if(!pool.length)pool=scores.filter(x=>x.score===best);let weights=pool.map(x=>Math.pow(1.065,x.score));let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total;for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i].b}return pool[pool.length-1].b}

function loadCover(b){
  // 지정된 한국어판 표지 우선. 없으면 자체 디자인 표지를 표시합니다.
